<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24372d"/>
      <stop offset="50%" stop-color="#101712"/>
      <stop offset="100%" stop-color="#050706"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0ad"/>
      <stop offset="25%" stop-color="#d9b45e"/>
      <stop offset="55%" stop-color="#fff0a3"/>
      <stop offset="80%" stop-color="#b88632"/>
      <stop offset="100%" stop-color="#f9df91"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Royal dark background -->
  <rect width="100" height="100" rx="23" fill="url(#bg)"/>

  <!-- Outer golden border -->
  <rect x="3" y="3" width="94" height="94" rx="21"
        fill="none" stroke="#8d6b30" stroke-width="1.2"/>

  <rect x="7" y="7" width="86" height="86" rx="18"
        fill="none" stroke="url(#gold)" stroke-width="1.8"/>

  <!-- Decorative royal diamonds -->
  <path d="M50 10 L53 14 L50 18 L47 14 Z" fill="url(#gold)"/>
  <path d="M50 82 L53 86 L50 90 L47 86 Z" fill="url(#gold)"/>

  <!-- Musical note shadow -->
  <path d="M58 23 V59
           C58 67 48 72 41 68
           C33 64 38 55 46 54
           C49 53 52 54 54 56
           V31 L73 26 V54
           C73 62 64 67 57 63
           C50 59 55 51 63 50
           C65 50 67 50 69 52
           V32 Z"
        fill="#d4af57" opacity="0.2" filter="url(#shadow)"/>

  <!-- Premium golden music note -->
  <path d="M57 22 V58
           C57 65 48 70 41 66
           C34 62 38 54 46 53
           C49 53 52 54 54 56
           V30 L72 25 V53
           C72 60 63 65 57 61
           C51 58 54 50 62 49
           C65 49 68 50 69 52
           V31 Z"
        fill="url(#gold)"/>

  <!-- Small ornamental highlight -->
  <circle cx="20" cy="50" r="1.5" fill="#f6dfa0"/>
  <circle cx="80" cy="50" r="1.5" fill="#f6dfa0"/>
</svg>
